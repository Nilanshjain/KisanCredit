services:
  - type: web
    name: kisancredit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MODEL_PATH
        value: models/home_credit_v2.pkl
      # --- secrets (sync: false → set values in the Render dashboard, never in this file) ---
      - key: SECRET_KEY                  # generate via: python -c "import secrets; print(secrets.token_urlsafe(48))"
        sync: false
      - key: DATABASE_URL                # postgresql+asyncpg://… from Neon
        sync: false
      - key: DATABASE_URL_SYNC           # postgresql://… (used by Alembic) from Neon
        sync: false
      - key: REDIS_URL                   # rediss://default:<token>@<host>:<port> from Upstash
        sync: false
      - key: CORS_ORIGINS                # https://<your-vercel-app>.vercel.app (comma-separated allowed)
        sync: false
      # --- optional integrations (unset -> graceful fallback) ---
      - key: GEMINI_API_KEY              # Phase 6 — aistudio.google.com (LLM explanations)
        sync: false
      - key: RESEND_API_KEY             # Phase 3b — resend.com (email OTP delivery)
        sync: false
      - key: RESEND_FROM_EMAIL          # Phase 3b — verified sender, e.g. onboarding@resend.dev
        sync: false
      # --- demo deployment (set DEMO_MODE=true + an operator email) ---
      - key: DEMO_MODE                  # true -> /auth/send-otp echoes the OTP for recruiters
        value: "true"
      - key: DEMO_ADMIN_EMAIL           # auto-seeded as role=admin so /admin is reachable
        sync: false
    healthCheckPath: /api/v1/health
