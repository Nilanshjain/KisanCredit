services:
  - type: web
    name: kisancredit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MODEL_PATH
        value: models/profitability_model_latest.pkl
      - key: PYTHON_VERSION
        value: 3.10.11
    healthCheckPath: /api/v1/health
